<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · Rukman Dataflow Management System</title>
  <meta name="theme-color" content="#1f4e79">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rukman DMS">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="img/logo.png" alt="Rukman Udyog" class="logo" width="1102" height="211">
    <h1>Rukman Dataflow Management System</h1>
    <p class="muted">Sign in to continue</p>

    <div id="notice" class="alert" role="alert" hidden></div>

    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none"
             autocorrect="off" spellcheck="false" maxlength="40" required>

      <label for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button type="button" class="pw-toggle" data-target="password" aria-pressed="false">Show</button>
      </div>

      <button type="submit" id="submit" class="btn primary block">Sign in</button>
    </form>
    <noscript><p class="alert error">This application needs JavaScript.</p></noscript>
  </main>
</body>
</html>
