# Supabase CLI configuration for LOCAL development only (supabase start /
# supabase db reset). It holds no secrets and no instance-specific values;
# every real instance is linked with `supabase link --project-ref <ref>`.
project_id = "rukman-dataflow-local"

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/system/*.sql"]
