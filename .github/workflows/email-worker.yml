# Sends queued ERP emails every 10 minutes and generates payment reminders
# once a day (09:00 IST). Configure these repository secrets for the instance:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SMTP_HOST, SMTP_PORT, SMTP_SECURE,
#   SMTP_USER, SMTP_PASSWORD, EMAIL_FROM_ADDRESS, EMAIL_FROM_NAME
name: email-worker
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: once | reminders
        default: once
concurrency:
  group: email-worker
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace worker --include-workspace-root=false
      - name: Run worker
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then MODE=reminders; else MODE=once; fi
          fi
          node src/main.ts "$MODE"
