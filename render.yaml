# One-click deploy blueprint for Render (render.com), a free hosting provider.
#
# This creates 3 things under one free Render account:
#   1. businessflow-db  — a free PostgreSQL database
#   2. businessflow-api — the backend (Node/Express)
#   3. businessflow-web — the frontend (Next.js)
#
# After the first deploy, two env vars need a one-time manual fill-in
# (Render doesn't let a blueprint auto-link two services' public URLs to
# each other before both exist) — see the "After deploying" note in the
# README for the two values to copy/paste, then click "Manual Deploy" on
# each service once to pick them up.

databases:
  - name: businessflow-db
    plan: free
    databaseName: businessflow_erp
    user: businessflow

services:
  - type: web
    name: businessflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build && npx ts-node prisma/seed.ts
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: businessflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: APP_NAME
        value: BusinessFlow ERP
      - key: CORS_ORIGIN
        sync: false # set manually in the dashboard after both services exist — see README

  - type: web
    name: businessflow-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # set manually in the dashboard after businessflow-api exists — see README
