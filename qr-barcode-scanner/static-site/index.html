<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>QR & Barcode Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #111;
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        gap: 14px;
      }
      h1 { font-size: 1.2rem; margin: 4px 0; text-align: center; }
      #signInSection { display: flex; justify-content: center; }
      #switchAccountBtn {
        padding: 6px 14px;
        font-size: 0.8rem;
        border: none;
        border-radius: 6px;
        background: #374151;
        color: #fff;
        cursor: pointer;
      }
      #reader {
        width: 100%;
        max-width: 420px;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #333;
        background: #000;
      }
      .buttons { display: flex; gap: 10px; width: 100%; max-width: 420px; }
      button {
        flex: 1;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      #startBtn { background: #2563eb; color: #fff; }
      #stopBtn { background: #374151; color: #fff; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .status {
        width: 100%;
        max-width: 420px;
        font-weight: 600;
        text-align: center;
        padding: 10px 16px;
        border-radius: 8px;
        background: #2a2a2a;
        color: #ccc;
      }
      .status.scanning { background: #1e3a5f; color: #8ecdf7; }
      .status.saving { background: #4a3c14; color: #ffd257; }
      .status.success { background: #14532d; color: #86efac; }
      .status.error { background: #5c1e1e; color: #fca5a5; }
      .last-value {
        width: 100%;
        max-width: 420px;
        background: #1c1c1c;
        border-radius: 8px;
        padding: 12px 16px;
        text-align: center;
        word-break: break-all;
      }
      .last-value .label {
        display: block;
        font-size: 0.7rem;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
      }
      .last-value .value { font-size: 1.05rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>QR & Barcode Scanner</h1>

    <div id="signInSection">
      <!-- Replace YOUR_GOOGLE_CLIENT_ID below with the OAuth Client ID
           from Google Cloud Console — see README.md "Google Sign-In setup". -->
      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
           data-callback="handleGoogleSignIn"
           data-auto_select="true">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="filled_blue"
           data-width="280">
      </div>
    </div>

    <div class="last-value" id="signedInBox" style="display:none;">
      <span class="label">Signed in as</span>
      <span class="value" id="signedInEmail"></span>
      <div style="margin-top: 10px;">
        <button id="switchAccountBtn">Switch account</button>
      </div>
    </div>

    <div id="reader"></div>

    <div class="buttons">
      <button id="startBtn" disabled>Start Scanner</button>
      <button id="stopBtn" disabled>Stop Scanner</button>
    </div>

    <div id="status" class="status">Press Start Scanner to begin</div>

    <div class="last-value" id="lastValueBox" style="display:none;">
      <span class="label">Last scanned</span>
      <span class="value" id="lastValueText"></span>
    </div>

    <script>
      // Set this to your deployed Apps Script Web App URL (ends in /exec).
      // See README.md — "Deploy the Apps Script API" step.
      const APPS_SCRIPT_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

      const RESUME_DELAY_MS = 1500;
      const DUPLICATE_WINDOW_MS = 3000;

      let html5QrCode = null;
      let busy = false;
      let lastValue = null;
      let lastValueTime = 0;

      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const statusEl = document.getElementById('status');
      const lastValueBox = document.getElementById('lastValueBox');
      const lastValueText = document.getElementById('lastValueText');
      const signInSection = document.getElementById('signInSection');
      const signedInBox = document.getElementById('signedInBox');
      const signedInEmailEl = document.getElementById('signedInEmail');
      const switchAccountBtn = document.getElementById('switchAccountBtn');

      function setStatus(type, message) {
        statusEl.className = 'status' + (type ? ' ' + type : '');
        statusEl.textContent = message;
      }

      let signedInEmail = null;

      // The ID token Google hands back is a JWT; decoding its payload
      // (no signature check needed here — this is just attribution, not
      // an access-control boundary) gives us the verified email directly,
      // the same way Google Forms auto-fills a signed-in respondent's email.
      function decodeJwtPayload(token) {
        const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const json = decodeURIComponent(
          atob(base64)
            .split('')
            .map(function (c) { return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); })
            .join('')
        );
        return JSON.parse(json);
      }

      function showSignedIn(email) {
        signedInEmail = email;
        signedInEmailEl.textContent = email;
        signInSection.style.display = 'none';
        signedInBox.style.display = 'block';
        startBtn.disabled = false;
      }

      // Referenced by name in the data-callback attribute on #g_id_onload —
      // Google Identity Services calls this after a successful sign-in.
      function handleGoogleSignIn(response) {
        const payload = decodeJwtPayload(response.credential);
        try { localStorage.setItem('signedInEmail', payload.email); } catch (e) { /* ignore */ }
        showSignedIn(payload.email);
        setStatus('', 'Signed in. Press Start Scanner to begin.');
      }

      // Show a cached sign-in immediately on reload without waiting for
      // Google's script to load — Google Identity Services' own
      // data-auto_select will still confirm/refresh this in the background.
      try {
        const cachedEmail = localStorage.getItem('signedInEmail');
        if (cachedEmail) showSignedIn(cachedEmail);
      } catch (e) { /* ignore */ }

      switchAccountBtn.addEventListener('click', function () {
        try { localStorage.removeItem('signedInEmail'); } catch (e) { /* ignore */ }
        signedInEmail = null;
        signedInBox.style.display = 'none';
        signInSection.style.display = 'flex';
        startBtn.disabled = true;
        if (window.google && google.accounts && google.accounts.id) {
          google.accounts.id.disableAutoSelect();
        }
      });

      function onScanSuccess(decodedText) {
        if (busy) return;

        const now = Date.now();
        if (decodedText === lastValue && now - lastValueTime < DUPLICATE_WINDOW_MS) {
          return;
        }
        lastValue = decodedText;
        lastValueTime = now;

        busy = true;
        lastValueText.textContent = decodedText;
        lastValueBox.style.display = 'block';
        setStatus('saving', 'Saving…');

        // Content-Type "text/plain" (not "application/json") keeps this a
        // CORS "simple request" so the browser doesn't send a preflight
        // OPTIONS request — Apps Script Web Apps don't handle doOptions().
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            value: decodedText,
            scannedBy: signedInEmail
          })
        })
          .then(function (res) { return res.json(); })
          .then(function (response) {
            if (response && response.success) {
              setStatus('success', 'Saved successfully');
            } else {
              setStatus('error', (response && response.error) || 'Failed to save');
            }
          })
          .catch(function () {
            setStatus('error', 'Failed to save — try again');
          })
          .finally(function () {
            setTimeout(function () {
              busy = false;
              setStatus('scanning', 'Scanning…');
            }, RESUME_DELAY_MS);
          });
      }

      function onScanFailure() {
        // Called continuously while no code is detected in the current frame — ignore.
      }

      // Shape required by navigator.mediaDevices.getUserMedia (MediaStreamConstraints).
      const PERMISSION_PROBE_CONSTRAINTS = { video: { facingMode: 'environment' } };
      // Shape required by html5-qrcode's start() cameraIdOrConfig argument —
      // NOT the same shape as MediaStreamConstraints. Passing the wrapped
      // { video: {...} } object here made html5-qrcode's own internal
      // getUserMedia call malformed, so it failed even after our probe
      // above had already been granted permission.
      const SCANNER_CAMERA_CONFIG = { facingMode: 'environment' };

      // Maps getUserMedia's DOMException.name to a specific, actionable
      // message, instead of one generic "denied or unavailable" catch-all.
      function describeCameraError(err) {
        const name = err && err.name;
        switch (name) {
          case 'NotAllowedError':
          case 'PermissionDeniedError':
            return 'Camera permission denied. Tap the site/lock icon next to the address bar → Permissions (or Site settings) → allow Camera, then reload this page.';
          case 'NotFoundError':
          case 'DevicesNotFoundError':
            return 'No camera found on this device.';
          case 'NotReadableError':
          case 'TrackStartError':
            return 'Camera is already in use by another app or browser tab. Close it and try again.';
          case 'SecurityError':
            return 'Camera blocked for security reasons. Make sure this page is served over HTTPS.';
          case 'OverconstrainedError':
            return 'No camera on this device supports the requested settings.';
          default:
            return 'Could not access the camera' + (err && err.message ? ': ' + err.message : '.');
        }
      }

      function stopAllTracks(stream) {
        if (!stream) return;
        stream.getTracks().forEach(function (track) {
          try { track.stop(); } catch (e) { /* already stopped */ }
        });
      }

      async function startScanner() {
        html5QrCode = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODABAR,
            Html5QrcodeSupportedFormats.ITF
          ],
          verbose: false
        });

        setStatus('', 'Starting camera…');

        try {
          await html5QrCode.start(
            SCANNER_CAMERA_CONFIG,
            { fps: 10, qrbox: { width: 250, height: 250 } },
            onScanSuccess,
            onScanFailure
          );
          stopBtn.disabled = false;
          setStatus('scanning', 'Scanning…');
        } catch (err) {
          startBtn.disabled = false;
          setStatus('error', 'Permission granted, but the scanner could not start' + (err && err.message ? ': ' + err.message : '.'));
        }
      }

      startBtn.addEventListener('click', async function () {
        if (!signedInEmail) {
          setStatus('error', 'Please sign in with Google first.');
          return;
        }

        startBtn.disabled = true;

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          startBtn.disabled = false;
          setStatus('error', 'Camera API not available in this browser. Make sure this page is served over HTTPS.');
          return;
        }

        setStatus('', 'Requesting camera permission…');

        let permissionStream;
        try {
          permissionStream = await navigator.mediaDevices.getUserMedia(PERMISSION_PROBE_CONSTRAINTS);
        } catch (err) {
          startBtn.disabled = false;
          setStatus('error', describeCameraError(err));
          return;
        }

        // Permission granted — release this probe stream immediately so
        // the scanner library can open its own stream for the live preview.
        stopAllTracks(permissionStream);

        await startScanner();
      });

      stopBtn.addEventListener('click', async function () {
        if (!html5QrCode) return;
        stopBtn.disabled = true;

        try {
          await html5QrCode.stop();
        } catch (e) {
          // Fall through and force-release the camera below regardless.
        }

        const videoEl = document.querySelector('#reader video');
        if (videoEl && videoEl.srcObject) {
          stopAllTracks(videoEl.srcObject);
          videoEl.srcObject = null;
        }

        try {
          await html5QrCode.clear();
        } catch (e) { /* ignore */ }

        startBtn.disabled = false;
        setStatus('', 'Stopped. Press Start Scanner to resume.');
      });
    </script>
  </body>
</html>
