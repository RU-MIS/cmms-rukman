<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — CMMS Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F5FEFF;
      color: #0A1F4E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 0.5px solid #D4E4F7;
      border-radius: 16px;
      padding: 48px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .icon {
      width: 64px; height: 64px;
      background: #EFF6FF;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: #7A9CC0; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #0E2F76;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #071E52; }
    .badge {
      display: inline-block;
      background: #EFF6FF;
      color: #0E2F76;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <span class="badge">CMMS Pro</span>
    <h1>You're offline</h1>
    <p>
      No internet connection detected.<br />
      Please check your network and try again.
    </p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
