<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rukman Portal</title>
  <meta name="description" content="Your sheets, forms and apps, all in one place.">
  <meta name="color-scheme" content="dark">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a1330;
      --surface: #12214a;
      --surface-2: #172a5c;
      --border: rgba(148,163,255,.14);
      --text: #e8ecfa; --muted: #93a0c8;
      --bar: rgba(10,19,48,.78);
      --sheet: #34d399; --form: #a78bfa; --app: #fb923c; --other: #38bdf8;
      --danger: #fb7185; --ok: #34d399;
      --ease: cubic-bezier(.22,1,.36,1);
      --hdr: 260px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: auto; }
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--text);
           background: var(--bg); min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    button { font-family: inherit; }

    /* ================= SPLASH ================= */
    .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center;
              gap: 14px; background: var(--bg); text-align: center; padding: 24px; }
    .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15);
            border-top-color: #a78bfa; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .splash p { margin: 0; color: var(--muted); font-size: 14px; max-width: 320px; }

    /* ================= PORTAL: FROZEN HEADER ================= */
    .top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50; color: #fff;
      padding: calc(40px + env(safe-area-inset-top)) 20px 14px;
      background:
        radial-gradient(420px 260px at 92% -10%, rgba(34,211,238,.35), transparent 70%),
        radial-gradient(380px 240px at 4% 110%, rgba(251,191,36,.22), transparent 70%),
        linear-gradient(135deg, #1e3a8a 0%, #4338ca 48%, #86198f 100%);
      box-shadow: 0 10px 30px rgba(3,8,25,.55);
      transform: translate3d(0,0,0);
      transition: transform .55s var(--ease);
      will-change: transform;
    }
    .top.compact { transform: translate3d(0, calc(-1 * var(--shift, 0px)), 0); }

    .inner { position: relative; max-width: 1000px; margin: 0 auto; }
    .hero-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
                transition: opacity .35s var(--ease); }
    .top.compact .hero-row { opacity: 0; }
    .brand { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; opacity: .85; }
    .top h1 { margin: 6px 0 4px; font-size: clamp(24px, 5vw, 38px); font-weight: 800; letter-spacing: -.02em; }
    .top p { margin: 0; opacity: .85; font-size: 15px; }
    .user { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px;
            background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
              background: #fff; color: #3730a3; font-weight: 800; flex: none; }
    .user-text { line-height: 1.2; padding-right: 4px; }
    .user-name  { font-size: 14px; font-weight: 700; }
    .user-email { font-size: 11px; opacity: .8; }

    .toolbar { margin-top: 18px; background: var(--bar); border: 1px solid rgba(255,255,255,.16);
               box-shadow: 0 8px 24px rgba(3,8,25,.4); border-radius: 18px; padding: 12px;
               display: flex; gap: 12px; flex-wrap: wrap; align-items: center; color: var(--text); }
    .search { flex: 1 1 240px; position: relative; }
    .search span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .6; }
    .search input { padding: 12px 14px 12px 42px; font-size: 15px; background: transparent; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chips:empty { display: none; }
    .chip { border: 1px solid var(--border); background: transparent; color: var(--text);
            padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: transform .25s var(--ease), background-color .25s var(--ease), border-color .25s var(--ease); }
    .chip:hover { transform: translate3d(0,-1px,0); background: rgba(255,255,255,.07); }
    .chip.active { background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; border-color: transparent; }

    .mini { display: none; align-items: center; gap: 8px; margin-left: auto; padding-left: 4px;
            opacity: 0; transition: opacity .4s var(--ease); font-size: 13px; font-weight: 600; }
    .mini .avatar { width: 30px; height: 30px; font-size: 13px; background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; }
    .top.compact .mini { opacity: 1; }
    @media (min-width: 720px) { .mini { display: flex; } }

    /* ================= PORTAL: CONTENT ================= */
    main { max-width: 1000px; margin: 0 auto 40px; padding: calc(var(--hdr) + 8px) 16px 0; }
    .crumbs { display: flex; align-items: center; gap: 12px; margin: 18px 4px 0; flex-wrap: wrap; }
    .back { border: 1px solid var(--border); background: transparent; color: var(--text);
            padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: transform .25s var(--ease), background-color .25s var(--ease); }
    .back:hover { transform: translate3d(-2px,0,0); background: rgba(255,255,255,.07); }
    .crumb-title { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
    .count { margin: 18px 4px 12px; font-size: 13px; color: var(--muted); font-weight: 600;
             letter-spacing: .05em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

    .card { --c: var(--other); position: relative; display: block; padding: 20px; border-radius: 20px;
            text-decoration: none; color: inherit; overflow: hidden; background: var(--surface); cursor: pointer;
            border: 1px solid var(--border); box-shadow: 0 6px 18px rgba(3,8,25,.35);
            transform: translate3d(0,0,0);
            transition: transform .45s var(--ease), box-shadow .45s var(--ease), border-color .45s var(--ease), background-color .45s var(--ease);
            animation: rise .6s var(--ease) both; will-change: transform; outline: none; }
    .card.quick { animation: fade .25s ease both; }
    .card.sheet { --c: var(--sheet); } .card.form { --c: var(--form); } .card.app { --c: var(--app); }
    .card.c0 { --c: #38bdf8; } .card.c1 { --c: #34d399; } .card.c2 { --c: #a78bfa; }
    .card.c3 { --c: #fb923c; } .card.c4 { --c: #f472b6; } .card.c5 { --c: #facc15; }
    .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
    .card::after { content: ""; position: absolute; width: 160px; height: 160px; right: -60px; top: -60px;
                   background: var(--c); opacity: .14; border-radius: 50%;
                   transition: transform .6s var(--ease), opacity .6s var(--ease); }
    .card:hover, .card:focus-visible { transform: translate3d(0,-6px,0); background: var(--surface-2);
                   box-shadow: 0 18px 36px rgba(3,8,25,.6);
                   border-color: color-mix(in srgb, var(--c) 50%, transparent); }
    .card:hover::after { transform: scale(1.6); opacity: .22; }
    .icon { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; font-size: 26px;
            background: color-mix(in srgb, var(--c) 18%, transparent); }
    .name { margin-top: 16px; font-size: 17px; font-weight: 700; line-height: 1.3; }
    .sub { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
    .row { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
             color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent);
             padding: 4px 10px; border-radius: 999px; }
    .go { font-size: 18px; color: var(--muted); transition: transform .45s var(--ease), color .45s var(--ease); }
    .card:hover .go { transform: translate3d(4px,0,0); color: var(--c); }
    @keyframes rise { from { opacity: 0; transform: translate3d(0,18px,0); } to { opacity: 1; transform: translate3d(0,0,0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty .big { font-size: 54px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 0 30px; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <noscript><p style="padding:24px">Please enable JavaScript to use the portal.</p></noscript>

  <!-- ============ SPLASH ============ -->
  <div class="splash" id="splash">
    <div class="spin" id="splashSpin"></div>
    <p id="splashMsg">Loading…</p>
    <button class="link" id="splashRetry" hidden>Try again</button>
  </div>

  <!-- ============ PORTAL ============ -->
  <div id="app" hidden>
    <header class="top" id="top">
      <div class="inner">
        <div class="hero-row">
          <div>
            <div class="brand">Rukman Portal</div>
            <h1 id="greet">Welcome 👋</h1>
            <p id="tagline">Your sheets, forms and apps, all in one place.</p>
          </div>
          <div class="user">
            <div class="avatar" id="avatar">?</div>
            <div class="user-text">
              <div class="user-name" id="uname"></div>
              <div class="user-email" id="uemail"></div>
            </div>
          </div>
        </div>

        <div class="toolbar" id="toolbar">
          <div class="search"><span>🔍</span><input id="q" type="text" placeholder="Search…" autocomplete="off"></div>
          <div class="chips" id="chips"></div>
          <div class="mini">
            <div class="avatar" id="mavatar">?</div><span id="mname"></span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="crumbs" id="crumbs" hidden>
        <button class="back" id="back">← All departments</button>
        <span class="crumb-title" id="crumbTitle"></span>
      </div>
      <div class="count" id="count"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </main>
    <footer>🔒 You can only see what has been shared with you.</footer>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    /* =====================================================================
       PORTAL
       ===================================================================== */
    const ICON  = { sheet: '📊', form: '📝', app: '🚀' };
    const LABEL = { all: 'All', sheet: 'Sheets', form: 'Forms', app: 'Apps' };
    const PLURAL = { sheet: 'sheet', form: 'form', app: 'app' };

    let ITEMS = [], FILTER = 'all', CURRENT = null, SINGLE = false, DEPT_NAMES = [], STAGGER = true;

    function greeting(first) {
      const h = new Date().getHours();
      const g = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
      return g + ', ' + first + ' 👋';
    }

    /* ---- frozen header: measure once, then only toggle a class on scroll ---- */
    const topEl = $('top'), toolbarEl = $('toolbar');

    function measure() {
      if ($('app').hidden) return;
      const shift = toolbarEl.getBoundingClientRect().top - topEl.getBoundingClientRect().top - 14;
      topEl.style.setProperty('--shift', Math.max(0, shift) + 'px');
      document.documentElement.style.setProperty('--hdr', topEl.offsetHeight + 'px');
    }
    window.addEventListener('load', measure);
    window.addEventListener('resize', measure);
    if (window.ResizeObserver) new ResizeObserver(measure).observe(toolbarEl);

    let ticking = false;
    window.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y = window.scrollY || document.documentElement.scrollTop;
        if (y > 60) topEl.classList.add('compact');
        else if (y < 20) topEl.classList.remove('compact');
        ticking = false;
      });
    }, { passive: true });

    function enterApp(res) {
      const mail = (res.user && res.user.email) || '';
      const fallback = mail ? mail.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : 'there';
      const full  = (res.user && res.user.name) || fallback;
      const first = full.split(' ')[0];

      $('greet').textContent   = greeting(first);
      $('uname').textContent   = full;
      $('uemail').textContent  = mail;
      $('avatar').textContent  = (full[0] || '?').toUpperCase();
      $('mavatar').textContent = (full[0] || '?').toUpperCase();
      $('mname').textContent   = first;

      ITEMS = res.items || [];
      CURRENT = null; SINGLE = false; FILTER = 'all'; $('q').value = '';
      const depts = [...new Set(ITEMS.map(i => i.dept))];
      if (depts.length === 1) { CURRENT = depts[0]; SINGLE = true; }

      $('splash').hidden = true; $('app').hidden = false;
      topEl.classList.remove('compact'); window.scrollTo(0, 0);
      refreshView(true);
    }

    $('back').addEventListener('click', () => { CURRENT = null; FILTER = 'all'; $('q').value = ''; refreshView(true); jumpTop(); });
    $('q').addEventListener('input', () => { STAGGER = false; render(); });

    function jumpTop() { window.scrollTo(0, 0); topEl.classList.remove('compact'); }

    function openDept(name) {
      CURRENT = name; FILTER = 'all'; $('q').value = '';
      refreshView(true); jumpTop();
    }

    function refreshView(stagger) {
      STAGGER = stagger;
      const inDept = CURRENT !== null;
      $('crumbs').hidden = !(inDept && !SINGLE);
      $('crumbTitle').textContent = inDept ? CURRENT : '';
      $('q').placeholder = inDept ? 'Search in ' + CURRENT + '…' : 'Search departments…';
      $('tagline').textContent = inDept
        ? (SINGLE ? 'Your sheets, forms and apps, all in one place.' : 'Everything in ' + CURRENT + '.')
        : 'Choose a department to get started.';
      buildChips();
      render();
      measure();
    }

    function buildChips() {
      const box = $('chips');
      if (CURRENT === null) { box.innerHTML = ''; return; }
      const mine = ITEMS.filter(i => i.dept === CURRENT);
      const types = ['all'].concat([...new Set(mine.map(i => i.type))]);
      box.innerHTML = types.map(t =>
        '<button class="chip ' + (t === FILTER ? 'active' : '') + '" data-t="' + esc(t) + '">' + esc(LABEL[t] || t) + '</button>'
      ).join('');
      box.querySelectorAll('.chip').forEach(b => b.onclick = () => {
        FILTER = b.dataset.t; buildChips(); STAGGER = false; render();
      });
    }

    function showEmpty(icon, text) {
      $('grid').innerHTML = '';
      $('count').textContent = '';
      const e = $('empty');
      e.hidden = false;
      e.innerHTML = '<div class="big">' + icon + '</div><p>' + esc(text) + '</p>';
    }

    function animAttrs(n) {
      return STAGGER ? 'style="animation-delay:' + (Math.min(n, 12) * 45) + 'ms"' : '';
    }

    function render() {
      const q = $('q').value.toLowerCase().trim();
      if (!ITEMS.length) return showEmpty('🔒', 'You have not been given access to anything yet.');
      $('empty').hidden = true;
      if (CURRENT === null) renderDepartments(q); else renderItems(q);
      STAGGER = false;
    }

    function renderDepartments(q) {
      const map = new Map();
      ITEMS.forEach(i => { if (!map.has(i.dept)) map.set(i.dept, []); map.get(i.dept).push(i); });

      let entries = [...map.entries()];
      if (q) entries = entries.filter(([name, list]) =>
        name.toLowerCase().includes(q) || list.some(i => i.title.toLowerCase().includes(q)));

      if (!entries.length) return showEmpty('🔎', 'No departments found. Try a different search term.');

      DEPT_NAMES = entries.map(e => e[0]);
      $('count').textContent = entries.length + ' department' + (entries.length > 1 ? 's' : '');
      $('grid').innerHTML = entries.map(([name, list], n) => {
        const parts = ['sheet', 'form', 'app']
          .map(t => [t, list.filter(i => i.type === t).length]).filter(p => p[1])
          .map(([t, c]) => c + ' ' + PLURAL[t] + (c > 1 ? 's' : ''));
        const other = list.filter(i => !PLURAL[i.type]).length;
        if (other) parts.push(other + ' other');
        return '<div class="card c' + (n % 6) + ' ' + (STAGGER ? '' : 'quick') + '" role="button" tabindex="0" data-i="' + n + '" ' + animAttrs(n) + '>' +
          '<div class="icon">🏢</div>' +
          '<div class="name">' + esc(name) + '</div>' +
          '<div class="sub">' + esc(parts.join(' · ')) + '</div>' +
          '<div class="row"><span class="badge">' + list.length + ' item' + (list.length > 1 ? 's' : '') + '</span><span class="go">→</span></div>' +
          '</div>';
      }).join('');

      $('grid').querySelectorAll('.card').forEach(c => {
        const go = () => openDept(DEPT_NAMES[+c.dataset.i]);
        c.onclick = go;
        c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
      });
    }

    function renderItems(q) {
      const list = ITEMS.filter(i =>
        i.dept === CURRENT &&
        (FILTER === 'all' || i.type === FILTER) &&
        i.title.toLowerCase().includes(q));

      if (!list.length) return showEmpty('🔎', 'No results found. Try a different search term.');

      $('count').textContent = list.length + ' item' + (list.length > 1 ? 's' : '');
      $('grid').innerHTML = list.map((i, n) =>
        '<a class="card ' + esc(i.type) + ' ' + (STAGGER ? '' : 'quick') + '" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer" ' + animAttrs(n) + '>' +
          '<div class="icon">' + (ICON[i.type] || '🔗') + '</div>' +
          '<div class="name">' + esc(i.title) + '</div>' +
          '<div class="row"><span class="badge">' + esc(i.type) + '</span><span class="go">→</span></div>' +
        '</a>').join('');
    }

    /* =====================================================================
       START
       ===================================================================== */
    function showSplash(text, retry) {
      $('app').hidden = true; $('splash').hidden = false;
      $('splashMsg').textContent = text;
      $('splashSpin').hidden = !!retry;
      $('splashRetry').hidden = !retry;
    }

    function load() {
      showSplash('Loading…', false);
      if (!(window.google && google.script && google.script.run)) {
        return showSplash('This page must be opened from the Apps Script web app link.', true);
      }
      google.script.run
        .withSuccessHandler(res => {
          if (!res || res.error) return showSplash((res && res.error) || 'Something went wrong. Please try again.', true);
          enterApp(res);
        })
        .withFailureHandler(err => {
          console.error('[portal] server call failed', err);
          showSplash('Cannot reach the server. Please check your internet connection and try again.', true);
        })
        .getMyLinks();
    }
    $('splashRetry').addEventListener('click', load);
    load();
  </script>
</body>
</html>
